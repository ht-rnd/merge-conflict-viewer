name: Create GitHub Release

# Runs after the CI/CD workflow succeeded on main. A release is created only
# when the version in package.json has no `v<version>` tag yet, i.e. when CI
# has just published a new npm version.
on:
  workflow_run:
    workflows: ["CI/CD for merge-conflict-viewer"]
    types: [completed]
    branches: [main]

jobs:
  release:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Extract package version
        id: package-version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Check whether the release already exists
        id: existing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "v${{ steps.package-version.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.existing.outputs.exists == 'false'
        run: npm ci

      - name: Build
        if: steps.existing.outputs.exists == 'false'
        run: npm run build:ci

      - name: Create GitHub Release
        if: steps.existing.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.package-version.outputs.version }}
          target_commitish: ${{ github.event.workflow_run.head_sha }}
          name: v${{ steps.package-version.outputs.version }}
          generate_release_notes: true
          prerelease: ${{ contains(steps.package-version.outputs.version, '-') || startsWith(steps.package-version.outputs.version, '0.') }}
          files: |
            dist/**/*

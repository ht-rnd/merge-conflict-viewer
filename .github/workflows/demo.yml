name: Deploy Demo to Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            demo/package-lock.json

      - name: Install Dependencies
        run: |
          npm ci
          npm --prefix demo ci

      # Writes demo/public/r/*.json so the registry is served from
      # https://<pages-url>/r/merge-conflict-viewer.json
      - name: Build shadcn registry
        run: npm run registry:build

      - name: Build Demo
        run: npm --prefix demo run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./demo/dist"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
